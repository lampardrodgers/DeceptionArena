server {
    listen 80;
    listen [::]:80;
    server_name onepoker.995003.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name onepoker.995003.xyz;

    root /var/www/onepoker.995003.xyz/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/onepoker.995003.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onepoker.995003.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /onepoker-web-icon.png {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
